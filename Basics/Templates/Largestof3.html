<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Largest3</title>
</head>
<body>
    <h2 align="center">Largest of Three Numbers</h2>
     <form method="post">
        {% csrf_token %}
        <table border="1" align="center">
            <tr>
                <td>Number 1</td>
                <td><input type="number" name="txt_num1"required placeholder="enter number" pattern="[0-9]{9}" ></td>
            </tr>
            <tr>
                <td>Number 2</td>
                <td><input type="number" name="txt_num2"required placeholder="enter number" pattern="[0-9]{9}" ></td>
            </tr>
            <tr>
                <td>Number 3</td>
                <td><input type="number" name="txt_num3"required placeholder="enter number" pattern="[0-9]{9}" ></td>
            </tr>
            <tr>
                <td colspan="2" align="center"><button type="submit">Submit</button></td>
            </tr>
            <tr>
                <td>result</td>
                <td>{{result}}</td>
            </tr>
        </table>
    </form>
</body>
</html>
