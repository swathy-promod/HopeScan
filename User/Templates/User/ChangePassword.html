<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change password</title>
</head>

<body>
    <form method="post">
        {% csrf_token %}
        <table align="center" border="1">
            <tr>
                <td>old password</td>
                <td><input type="text" name="txt_oldpass" id=""required placeholder="Enter Old Password" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters"></td>
            </tr>
            <tr>
                <td>new password</td>
                <td><input type="text" name="txt_pass1"required placeholder="Enter New Password"pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters"></td>
            </tr>
            <tr>
                <td>retype password</td>
                <td><input type="text" name="txt_pass2"required placeholder="Confirm Password"pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters"></td>
            </tr>
            <tr>
                <td colspan="2">
                    <input type="submit" name="btn_submit">
                </td>
            </tr>
        </table>
    </form>
</body>

</html>
required
