{% extends 'Guest/Header.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
    <style>
         body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            /* padding: 40px 20px; */
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .registration-container {
            background: rgb(235, 229, 232);
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 600px;
            padding: 40px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .registration-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .registration-header h2 {
            color: #333;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group label {
            display: block;
            color: #555;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            color: #333;
            transition: all 0.3s ease;
            background-color: #f9f9f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input::placeholder {
            color: #999;
        }

        .form-group-full {
            grid-column: 1 / -1;
        }

        .form-group-radio {
            margin-bottom: 20px;
        }

        .form-group-radio label {
            display: block;
            color: #555;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .radio-group {
            display: flex;
            gap: 30px;
        }

        .radio-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .radio-item input[type="radio"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .radio-item label {
            margin: 0;
            text-transform: none;
            font-weight: 500;
            cursor: pointer;
            font-size: 14px;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }

        .btn-register,
        .btn-reset {
            padding: 12px 15px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-register {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-register:active {
            transform: translateY(0);
        }

        .btn-reset {
            background-color: #f0f0f0;
            color: #333;
            border: 2px solid #e0e0e0;
        }

        .btn-reset:hover {
            background-color: #e8e8e8;
            transform: translateY(-2px);
        }

        .btn-reset:active {
            transform: translateY(0);
        }

        @media (max-width: 680px) {
            .registration-container {
                padding: 30px 20px;
            }

            .registration-header h2 {
                font-size: 24px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .button-group {
                grid-template-columns: 1fr;
            }

            .radio-group {
                flex-direction: column;
                gap: 12px;
            }
        }
    </style>
</head>

<body>
    <div class="registration-container">
        <div class="registration-header">
            <h2>User Registration</h2>
        </div>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-row">
                <div class="form-group">
                    <label for="username">Name</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="txt_name" 
                        required 
                        placeholder="Enter name"
                        
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input 
                        type="email" 
                        id="email"
                        name="txt_email" 
                        required 
                        placeholder="Enter email"
                    >
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="contact">Contact</label>
                    <input 
                        type="text" 
                        id="contact"
                        name="txt_contact" 
                        required 
                        placeholder="Enter contact"
                    >
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input 
                        type="date" 
                        id="dob"
                        name="txt_dob" 
                        required
                    >
                </div>
            </div>

            <div class="form-group form-group-full">
                <label for="address">Address</label>
                <input 
                    type="text" 
                    id="address"
                    name="txt_address" 
                    required 
                    placeholder="Enter address"
                >
            </div>

            <div class="form-group-radio" style="display: flex; flex-direction: column;">
                <label>Gender</label>
                <div class="radio-group" style="display: flex; flex-direction: row;margin:auto;">
                    <div class="radio-item">
                        <input 
                            type="radio" 
                            id="male"
                            name="gender" 
                            value="Male" 
                            required
                        >
                        <label for="male">Male</label>
                    </div>
                    <div class="radio-item">
                        <input 
                            type="radio" 
                            id="female"
                            name="gender" 
                            value="Female" 
                            required
                        >
                        <label for="female">Female</label>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="sel_district">District</label>
                    <select name="select_district" id="sel_district" required>
                        <option value="">Select District</option>
                        {% for i in district %}
                        <option value="{{i.id}}">{{i.district_name}}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="sel_place">Place</label>
                    <select name="place_name" id="sel_place" required>
                        <option value="">Select Place</option>
                    </select>
                </div>
            </div>

            <div class="form-group form-group-full">
                <label for="txt_photo">Photo</label>
                <input 
                    type="file" 
                    id="txt_photo"
                    name="txt_photo" 
                    required
                >
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="txt_pass" 
                        required 
                        placeholder="Enter password"
                        pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                        title="Must contain at least one number, one uppercase and lowercase letter, and at least 8 or more characters"
                    >
                </div>

                <div class="form-group">
                    <label for="password2">Re-enter Password</label>
                    <input 
                        type="password" 
                        id="password2"
                        name="txt_pass1" 
                        required 
                        placeholder="Retype password"
                    >
                </div>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-register">Register</button>
                <button type="reset" class="btn-reset">Reset</button>
            </div>
        </form>
    </div>

</body>
</html>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
    $('#sel_district').change(function () {
        var did = $(this).val();
        var ur = "{% url 'Guest:ajaxplace' %}"
        $.ajax({
            url: ur,
            data: { did: did },
            success: function (data) {
                $('#sel_place').html(data);
            }
        });
    });
</script>

{% endblock content %}
