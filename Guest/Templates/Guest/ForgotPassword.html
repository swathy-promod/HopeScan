<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #4f46e5 0%, #0ea5e9 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #111827;
        }

        .forgot-card {
            width: min(480px, 100%);
            background: rgba(255,255,255,0.96);
            border-radius: 24px;
            box-shadow: 0 24px 80px rgba(15,23,42,0.18);
            padding: 36px;
            border: 1px solid rgba(148,163,184,0.18);
        }

        .forgot-card h1 {
            margin: 0 0 10px;
            font-size: 2rem;
            letter-spacing: -0.03em;
        }

        .forgot-card p {
            margin: 0 0 26px;
            color: #475569;
            line-height: 1.7;
            font-size: 0.97rem;
        }

        .form-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 22px;
        }

        .form-row label {
            font-size: 0.95rem;
            font-weight: 600;
            color: #334155;
        }

        .form-row input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            font-size: 1rem;
            color: #0f172a;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-row input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37,99,235,0.12);
            background: #ffffff;
        }

        .submit-button {
            width: 100%;
            padding: 14px 16px;
            margin-top: 4px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #2563eb 0%, #38bdf8 100%);
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .submit-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 18px 40px rgba(56,189,248,0.2);
        }

        .footer-link {
            margin-top: 20px;
            text-align: center;
            font-size: 0.95rem;
            color: #475569;
        }

        .footer-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }

        .status-message {
            margin-bottom: 18px;
            padding: 14px 16px;
            border-radius: 14px;
            background: #eff6ff;
            color: #1d4ed8;
            border: 1px solid #bfdbfe;
            font-size: 0.95rem;
        }

        @media (max-width: 480px) {
            .forgot-card {
                padding: 28px 22px;
            }

            .forgot-card h1 {
                font-size: 1.75rem;
            }
        }
    </style>
</head>

<body>
    <form action="" method="post">
        {% csrf_token %}
        <table align="center" style="margin-top: 300px;">
            <tr>
                <td>Email</td>
                <td><input type="email" name="txt_email" id=""></td>
            </tr>
            <tr>
                <td colspan="2" align="center"><input type="submit" value="Send"></td>
            </tr>
        </table>
    </form>
    {% if msg %}
    <script>
        alert("OTP is sented to {{msg}}")
        window.location = "{% url 'Guest:otp' %}"
    </script>
    {% endif %}
</body>
</html>
