
{% extends 'Administrator/Header.html' %}
{% block content %}

<style>
  .container-card{max-width:980px;margin:18px auto;padding:18px;border:1px solid #eaf4fb;border-radius:8px;background:#fff}
  .table{width:100%;border-collapse:collapse;margin-top:6px}
  .table th,.table td{border:1px solid #e6eef6;padding:10px;vertical-align:top}
  .table th{background:#f7fbff}
  @media (max-width:700px){.table td:nth-child(2),.table th:nth-child(2){display:none}}
</style>

<div class="container-card">
  <h2 style="text-align:center;margin:0 0 12px">Feedback</h2>

  <table class="table" aria-label="Feedback list">
    <tr>
      <th>sl no</th>
      <th>date</th>
      <th>name</th>
      <th>content</th>
    </tr>
      {% for i in viewfeedbackdata %}
      <tr>
        <td>{{ forloop.counter }}</td>
        <td>{{ i.feedback_date }}</td>
        <td>{{ i.user.userregistration_name }}</td>
        <td>{{ i.feedback_content }}</td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="4" style="text-align:center;padding:14px">No feedback available.</td>
      </tr>
      {% endfor %}
    </table>
</div>

{% endblock %}
