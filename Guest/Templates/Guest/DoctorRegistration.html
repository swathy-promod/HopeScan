{% extends 'Guest/Header.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Registration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            /* padding: 40px 20px; */
        }

        .registration-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 45px;
            margin-top: 50px;
            margin-bottom: 50px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .registration-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .registration-header h2 {
            color: #333;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            color: #555;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input[type="text"],
        .form-group input[type="password"],
        .form-group input[type="email"],
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            color: #333;
            transition: all 0.3s ease;
            background-color: #f9f9f9;
            font-family: inherit;
        }

        .form-group input[type="text"]:focus,
        .form-group input[type="password"]:focus,
        .form-group input[type="email"]:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #999;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-group select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 20px;
            padding-right: 40px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-row .form-group {
            margin-bottom: 0;
        }

        .radio-group {
            display: flex;
            gap: 30px;
            margin-top: 10px;
        }

        .radio-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .radio-item input[type="radio"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .radio-item label {
            margin: 0;
            font-size: 14px;
            font-weight: 500;
            text-transform: none;
            cursor: pointer;
            color: #555;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: block;
            padding: 12px 15px;
            background-color: #f9f9f9;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            cursor: pointer;
            color: #667eea;
            font-weight: 500;
            transition: all 0.3s ease;
            text-align: center;
        }

        .file-input-wrapper input[type="file"]:focus + .file-input-label {
            border-color: #667eea;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .file-input-wrapper:hover .file-input-label {
            border-color: #667eea;
        }

        .file-name {
            display: block;
            margin-top: 6px;
            font-size: 12px;
            color: #888;
            font-weight: 500;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-reset {
            background: #f0f0f0;
            color: #555;
            border: 2px solid #e0e0e0;
        }

        .btn-reset:hover {
            background: #e8e8e8;
            border-color: #999;
        }

        @media (max-width: 600px) {
            .registration-container {
                padding: 30px 20px;
            }

            .registration-header h2 {
                font-size: 24px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .button-group {
                grid-template-columns: 1fr;
            }

            .radio-group {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="registration-container">
        <div class="registration-header">
            <h2>Doctor Registration</h2>
        </div>

        <form enctype="multipart/form-data" method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="txt_name">Name</label>
                <input 
                    type="text" 
                    name="txt_name" 
                    id="txt_name"
                    required 
                    placeholder="Enter your full name"
                    title="Name Allows Only Alphabets, Spaces and First Letter Must Be Capital Letter"
                    pattern="^[A-Z]+[a-zA-Z ]*$"
                >
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="txt_email">Email</label>
                    <input 
                        type="email" 
                        name="txt_email" 
                        id="txt_email"
                        required 
                        placeholder="Enter your email"
                    >
                </div>

                <div class="form-group">
                    <label for="txt_contact">Contact</label>
                    <input 
                        type="text" 
                        name="txt_contact" 
                        id="txt_contact"
                        placeholder="Enter contact number"
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="txt_address">Address</label>
                <textarea 
                    name="txt_address" 
                    id="txt_address"
                    required 
                    placeholder="Enter your address"
                ></textarea>
            </div>

            <div class="form-group" style="display: flex; flex-direction: column;">
                <label>Gender</label>
                <div class="radio-group" style="display: flex; flex-direction: row;margin:auto;">
                    <div class="radio-item">
                        <input 
                            type="radio" 
                            name="gender" 
                            value="Male" 
                            id="gender_male"
                            required
                        >
                        <label for="gender_male">Male</label>
                    </div>
                    <div class="radio-item">
                        <input 
                            type="radio" 
                            name="gender" 
                            value="Female" 
                            id="gender_female"
                            required
                        >
                        <label for="gender_female">Female</label>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="sel_district">District</label>
                    <select name="select_district" id="sel_district" required>
                        <option value="">Select District</option>
                        {% for i in district %}
                        <option value="{{i.id}}">{{i.district_name}}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="sel_place">Place</label>
                    <select name="place_name" id="sel_place" required>
                        <option value="">Select Place</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="txt_photo1">Photo</label>
                    <div class="file-input-wrapper">
                        <input 
                            type="file" 
                            name="txt_photo1" 
                            id="txt_photo1"
                            required
                            accept="image/*"
                            onchange="updateFileName(this, 'name1')"
                        >
                        <label for="txt_photo1" class="file-input-label">Choose File</label>
                        <span class="file-name" id="name1"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="txt_photo2">Proof</label>
                    <div class="file-input-wrapper">
                        <input 
                            type="file" 
                            name="txt_photo2" 
                            id="txt_photo2"
                            required
                            accept="image/*"
                            onchange="updateFileName(this, 'name2')"
                        >
                        <label for="txt_photo2" class="file-input-label">Choose File</label>
                        <span class="file-name" id="name2"></span>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="txt_pass">Password</label>
                <input 
                    type="password" 
                    id="txt_pass" 
                    name="txt_pass" 
                    required 
                    placeholder="Enter password"
                    pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                    title="Must contain at least one number, one uppercase and lowercase letter, and at least 8 or more characters"
                >
            </div>

            <div class="form-group">
                <label for="txt_exp">Doctor Experience</label>
                <textarea 
                    name="txt_exp" 
                    id="txt_exp"
                    placeholder="Write your experience"
                ></textarea>
            </div>

            <div class="button-group">
                <button type="submit" class="btn btn-submit">Register</button>
                <button type="reset" class="btn btn-reset">Reset</button>
            </div>
        </form>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script>
        function updateFileName(input, elementId) {
            const fileName = input.files[0] ? input.files[0].name : '';
            document.getElementById(elementId).textContent = fileName ? 'Selected: ' + fileName : '';
        }

        $('#sel_district').change(function () {
            var did = $(this).val();
            var ur = "{% url 'Guest:ajaxplace' %}"
            $.ajax({
                url: ur,
                data: { did: did },
                success: function (data) {
                    $('#sel_place').html(data);
                }
            });
        });
    </script>
</body>
</html>
{% endblock content %}
